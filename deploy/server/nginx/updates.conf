root /srv/data/lumatile/updates;
autoindex off;
open_file_cache off;

location = /android/distribution.json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files /android/server.json @website_distribution;
}
location @website_distribution {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    return 200 '{"mode":"website","websiteUrl":"https://lumatile.cn/download/#download-android"}';
}
location ~ ^/(stable|alpha)/(android|announcement)\.json$ {
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
}
location ~ ^/releases/[^/]+/[^/]+\.apk$ {
    add_header Cache-Control "no-store" always;
    add_header Access-Control-Allow-Origin "*" always;
    default_type application/vnd.android.package-archive;
    if (!-f /srv/data/lumatile/updates/android/server.json) { return 503; }
    try_files $uri =404;
}
