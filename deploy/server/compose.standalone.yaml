services:
  portal:
    ports: !reset []

  jobs:
    environment:
      LUMATILE_ACCESS_LOG_FORMAT: dated
    group_add: !override ["101"]
    volumes:
      - ${LUMATILE_DATA_ROOT:-/srv/data/lumatile}/logs:/logs

  nginx:
    image: ${LUMATILE_NGINX_IMAGE:-nginx:stable-alpine}
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_healthy
        restart: true
    environment:
      TZ: CST-8
    ports:
      - "${LUMATILE_BIND_ADDRESS:-0.0.0.0}:${LUMATILE_HTTP_PORT:-80}:80"
      - "${LUMATILE_BIND_ADDRESS:-0.0.0.0}:${LUMATILE_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx:/etc/nginx/lumatile:ro
      - ./nginx/entry.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LUMATILE_TLS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${LUMATILE_ACME_DIR:-/var/www/letsencrypt}:/var/www/letsencrypt:ro
      - ${LUMATILE_WEB_DIR:-/srv/www/lumatile}:/srv/www/lumatile:ro
      - ${LUMATILE_CONSOLE_DIR:-/srv/www/lumatile-console-ui}:/srv/www/lumatile-console-ui:ro
      - ${LUMATILE_UPDATE_DIR:-${LUMATILE_DATA_ROOT:-/srv/data/lumatile}/updates}:/srv/data/lumatile/updates:ro
      - ${LUMATILE_DATA_ROOT:-/srv/data/lumatile}/logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "--header=Host: api.lumatile.cn", "-O", "/dev/null", "https://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
