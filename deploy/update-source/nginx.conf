server {
    listen 80;
    server_name _;
    root /srv/updates;
    autoindex off;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # 匿名统计心跳：只依赖访问日志计数，响应 204 无内容
    location = /beacon/desktop {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 204;
    }

    location = /beacon/android {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 204;
    }

    location = /api/feedback {
        client_max_body_size 8k;
        proxy_pass http://feedback:8080;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 反馈管理后台：与统计页共用同一份 Basic Auth 凭据（见 compose 挂载的
    # admin.htpasswd）。鉴权通过后注入 X-Admin-User，反馈服务据此拒绝绕过
    # Nginx 的直接访问。
    location = /admin { return 301 /admin/; }

    location /admin/ {
        auth_basic "LumaTile Admin";
        auth_basic_user_file /etc/nginx/admin.htpasswd;
        proxy_pass http://feedback:8080;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Admin-User $remote_user;
    }

    location /stable/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /releases/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { application/vnd.android.package-archive apk; }
        try_files $uri =404;
    }
}
