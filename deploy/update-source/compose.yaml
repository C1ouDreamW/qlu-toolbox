services:
  update-source:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${UPDATE_DATA_DIR:-./data}:/srv/updates:ro
      # 与统计页共用凭据；路径不同可设 ADMIN_HTPASSWD 覆盖
      - ${ADMIN_HTPASSWD:-/etc/nginx/lumatile-stats.htpasswd}:/etc/nginx/admin.htpasswd:ro
    depends_on:
      - feedback

  feedback:
    build: ${FEEDBACK_BUILD_CONTEXT:-../feedback}
    restart: unless-stopped
    environment:
      FEEDBACK_DB_PATH: /data/feedback.db
    volumes:
      - ${FEEDBACK_DATA_DIR:-./feedback-data}:/data
