<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>LumaTile 控制台</title>
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body class="console">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <main id="login" class="login">
    <div class="login-shell">
      <div class="login-brand">
        <img class="brand-icon" src="/logo.png" width="64" height="64" alt="">
        <p class="login-brand-name">LumaTile</p>
        <p class="login-brand-product">运营控制台</p>
        <a href="https://lumatile.cn/">访问官网</a>
      </div>
      <div class="login-panel">
        <h1>登录控制台</h1>
        <p id="login-message" class="message" role="status">正在检查登录状态…</p>
        <form id="login-form" method="post">
          <label>用户名<input name="username" autocomplete="username" maxlength="150" required></label>
          <div>
            <label for="login-password">密码</label>
            <div class="password-input">
              <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
              <button id="show-password" type="button" aria-controls="login-password" aria-pressed="false">显示</button>
            </div>
          </div>
          <button id="login-submit" class="primary" type="submit" disabled>登录</button>
          <button id="retry-session" type="button" hidden>重试连接</button>
        </form>
      </div>
    </div>
  </main>
  <div id="workspace" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#overview"><img class="brand-icon" src="/logo.png" width="32" height="32" alt="">LumaTile <small>控制台</small></a>
        <nav class="console-nav" aria-label="控制台导航">
          <a href="#overview" data-view="overview">概览</a>
          <a href="#feedback" data-view="feedback">反馈</a>
          <a href="#publish" data-view="publish">发布</a>
          <a href="#stats" data-view="stats">统计</a>
          <a href="#operations" data-view="operations" hidden>操作记录</a>
        </nav>
        <details class="account">
          <summary><span id="username"></span></summary>
          <div class="account-menu">
            <a href="#account">修改密码</a>
            <button id="logout" type="button">退出登录</button>
          </div>
        </details>
      </div>
    </header>
    <main id="main" class="workspace" tabindex="-1">
      <p id="account-status" class="message" role="status"></p>
      <section id="view-overview" class="view" hidden>
        <div class="page-heading">
          <h1>运营概览</h1>
          <a class="outline-link" href="https://lumatile.cn/">访问官网</a>
        </div>
        <div class="panel versions">
          <h2>线上版本</h2>
          <dl>
            <div><dt>Windows</dt><dd id="windows-version">—</dd></div>
            <div><dt>macOS</dt><dd id="macos-version">—</dd></div>
            <div><dt>Android Stable</dt><dd id="stable-version">—</dd></div>
            <div><dt>Android Alpha</dt><dd id="alpha-version">—</dd></div>
          </dl>
        </div>
        <div class="panel">
          <h2>待处理反馈</h2>
          <p id="pending-feedback" class="pending" aria-live="polite">—</p>
          <a href="#feedback">查看反馈</a>
        </div>
        <p id="overview-message" class="message" role="status"></p>
      </section>
      <section id="view-feedback" class="view" hidden>
        <div class="page-heading"><h1 id="feedback-title" tabindex="-1">用户反馈</h1></div>
        <div class="panel">
          <form id="feedback-filter" class="form-grid">
            <label>状态<select id="status"><option value="new">待处理</option><option value="resolved">已处理</option><option value="all">全部</option></select></label>
            <label>搜索<input id="search" type="search" maxlength="120" placeholder="内容、联系方式或编号"></label>
            <button class="primary" type="submit">搜索</button>
          </form>
          <p id="feedback-counts" class="muted" aria-live="polite"></p>
          <p id="feedback-message" class="message" role="status"></p>
          <ul id="feedback" class="feedback-list"></ul>
          <nav class="pagination" aria-label="反馈分页" hidden>
            <p id="feedback-range" class="muted" aria-live="polite"></p>
            <div><button id="previous" type="button" disabled>上一页</button><button id="next" type="button" disabled>下一页</button></div>
          </nav>
        </div>
      </section>
      <section id="view-publish" class="view" hidden>
        <div class="page-heading"><h1>发布</h1></div>
        <div class="publish-grid">
          <div class="panel">
            <div class="panel-heading"><h2>Android 分发</h2><span id="mode-state" class="badge">读取中</span></div>
            <label>分发方式<select id="mode" disabled><option value="website">官网外部下载</option><option value="server">服务器 APK 下载</option></select></label>
            <div class="actions"><button id="save-mode" class="primary" type="button" disabled>保存策略</button></div>
            <p id="mode-message" class="message" role="status"></p>
          </div>
          <div class="panel">
            <div class="panel-heading"><h2>应用内公告</h2><button id="new-draft" type="button" hidden>新建草稿</button></div>
            <div class="form-grid announcement-fields">
              <label>渠道<select id="channel"><option value="stable">Stable</option><option value="alpha">Alpha</option></select></label>
              <label>草稿<select id="draft" disabled></select></label>
            </div>
            <p id="active-announcement" class="message" role="status"></p>
            <details id="draft-preview" class="preview" hidden open>
              <summary>预览所选草稿</summary>
              <article>
                <h3 id="preview-title"></h3>
                <p id="preview-body" class="feedback-body"></p>
                <p id="preview-url" class="muted"></p>
                <p id="preview-expiry" class="muted"></p>
              </article>
            </details>
            <div class="actions">
              <button id="publish" class="primary" type="button" disabled>发布到所选渠道</button>
              <button id="withdraw" type="button" disabled>撤回当前公告</button>
              <button id="edit-draft" type="button" hidden>编辑草稿</button>
              <button id="delete-draft" type="button" hidden>删除草稿</button>
            </div>
            <p id="announcement-message" class="message" role="status"></p>
            <form id="draft-form" class="stack" hidden>
              <h3 id="draft-form-title"></h3>
              <label>标题<input name="title" maxlength="120" required></label>
              <label>正文<textarea name="body" rows="5" required></textarea></label>
              <label>级别<select name="level"><option value="info">普通</option><option value="warning">重要</option></select></label>
              <label>详情链接<input name="url" type="url" maxlength="200" placeholder="https://"></label>
              <label>到期时间（本机时间）<input name="expiresAt" type="datetime-local"></label>
              <div class="actions"><button id="save-draft" class="primary" type="submit">保存草稿</button><button id="cancel-draft" type="button">取消</button></div>
              <p id="draft-message" class="message" role="status"></p>
            </form>
          </div>
        </div>
      </section>
      <section id="view-stats" class="view" hidden>
        <div class="page-heading"><h1>访问统计</h1><button id="refresh-stats" type="button">刷新报告</button></div>
        <p id="stats-message" class="message" role="status"></p>
        <div id="stats-content" class="stack"></div>
      </section>
      <section id="view-operations" class="view" hidden>
        <div class="page-heading"><h1>操作记录</h1></div>
        <div class="panel">
          <form id="operation-filter" class="form-grid operation-filter">
            <label>搜索<input id="operation-query" type="search" maxlength="120" placeholder="操作者、对象或结果"></label>
            <button class="primary" type="submit">搜索</button>
          </form>
          <p id="operations-message" class="message" role="status"></p>
          <div id="operations-content"></div>
          <div class="actions">
            <button id="operations-prev" type="button" disabled>上一页</button>
            <button id="operations-next" type="button" disabled>下一页</button>
          </div>
        </div>
      </section>
      <section id="view-account" class="view" hidden>
        <div class="page-heading"><h1>修改密码</h1></div>
        <form id="password-form" class="panel stack account-form" method="post">
          <label>当前密码<input type="password" name="old_password" autocomplete="current-password" required></label>
          <label>新密码<input type="password" name="new_password1" autocomplete="new-password" required></label>
          <label>确认新密码<input type="password" name="new_password2" autocomplete="new-password" required></label>
          <div><button id="password-submit" class="primary" type="submit">保存密码</button></div>
          <p id="password-message" class="message" role="status"></p>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
