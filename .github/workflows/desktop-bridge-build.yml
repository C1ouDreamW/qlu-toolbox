name: Build desktop bridge (no release)

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  LUMATILE_BUILD_CHANNEL: stable
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

defaults:
  run:
    shell: bash

concurrency:
  group: desktop-bridge-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate reserved desktop bridge and both Alpha sources
    if: ${{ github.repository == 'C1ouDreamW/qlu-toolbox' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check immutable bridge gate, main ancestry and both published Alphas
        id: identity
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/validate-desktop-bridge.mjs "$GITHUB_REF_NAME"

  windows:
    name: Build verified Windows bridge installer and ZIP
    needs: [validate]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Recheck exact bridge source before dependency installation
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/validate-desktop-bridge.mjs "$GITHUB_REF_NAME"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies and test
        run: |
          npm ci
          uv sync --locked
          uv lock --check
          uv run --locked python -B -m unittest discover -s tests -v
          npm run test:release
      - name: Build Windows Stable bridge identity and dependency evidence
        run: |
          node scripts/prepare-release.mjs --platform windows --channel stable
          node scripts/prepare-release.mjs --platform windows --channel stable --verify
          npm run build:backend
          npm run build
          npm run test:desktop
          npx electron-builder --win dir nsis --x64 --publish never
          node scripts/generate-build-inventory.mjs windows build-metadata
      - name: Verify and collect legacy bridge filenames
        shell: pwsh
        run: |
          node scripts/verify-release-build.mjs --bridge windows $env:GITHUB_REF_NAME release/win-unpacked verification.json
          if ($LASTEXITCODE -ne 0) { throw 'Bridge package verification failed' }
          $version = node -p "require('./lumatile/build-info.json').version"
          New-Item -ItemType Directory artifacts | Out-Null
          Copy-Item build-metadata/* artifacts
          Copy-Item verification.json artifacts/verification.json
          Copy-Item "release/LumaTile_v${version}_x64_Setup.exe" "artifacts/LumaTile_v${version}_x64_Setup.exe"
          "@echo off`r`nstart `"`" `"%~dp0LumaTile.exe`"`r`n" | Set-Content -Encoding ascii 'release/win-unpacked/Start LumaTile.cmd'
          Rename-Item release/win-unpacked LumaTile
          Compress-Archive -Path release/LumaTile -DestinationPath "artifacts/LumaTile_v${version}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bridge-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build verified macOS arm64 bridge DMG
    needs: [validate]
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RELEASE_EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Recheck exact bridge source before dependency installation
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/validate-desktop-bridge.mjs "$GITHUB_REF_NAME"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies and test
        run: |
          test "$(uname -m)" = arm64
          npm ci
          uv sync --locked
          uv lock --check
          uv run --locked python -B -m unittest discover -s tests -v
          npm run test:release
      - name: Build ad-hoc signed macOS Stable bridge and dependency evidence
        run: |
          node scripts/prepare-release.mjs --platform macos --channel stable
          node scripts/prepare-release.mjs --platform macos --channel stable --verify
          npm run build:backend
          npm run build
          npm run test:desktop
          npx electron-builder --mac dmg --arm64 --publish never
          node scripts/generate-build-inventory.mjs macos build-metadata
      - name: Verify mounted DMG and collect the legacy bridge filename
        run: |
          version=$(node -p "require('./lumatile/build-info.json').version")
          mount_dir=$(mktemp -d)
          trap 'bash scripts/detach-dmg.sh "$mount_dir" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "release/LumaTile_v${version}_arm64.dmg" -nobrowse -mountpoint "$mount_dir"
          node scripts/verify-release-build.mjs --bridge macos "$GITHUB_REF_NAME" "$mount_dir/LumaTile.app" verification.json
          bash scripts/detach-dmg.sh "$mount_dir"
          trap - EXIT
          mkdir artifacts
          cp build-metadata/* artifacts/
          cp verification.json artifacts/verification.json
          cp "release/LumaTile_v${version}_arm64.dmg" artifacts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bridge-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: Assemble and reverify both desktop targets without publishing
    needs: [validate, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Recheck bridge source and both Alpha publications
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/validate-desktop-bridge.mjs "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bridge-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: inputs/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bridge-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: inputs/macos
      - name: Generate complete bridge evidence and three initial Stable pointers
        run: |
          node scripts/build-desktop-bridge-bundle.mjs "$GITHUB_REF_NAME" inputs/windows inputs/macos inputs/windows/verification.json inputs/macos/verification.json bridge-output
          node scripts/verify-desktop-bridge-bundle.mjs "$GITHUB_REF_NAME" "bridge-output/releases/$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-bridge-${{ needs.validate.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bridge-output
          if-no-files-found: error
          retention-days: 7
