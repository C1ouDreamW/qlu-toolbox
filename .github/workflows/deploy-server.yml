name: Deploy LumaTile

on:
  workflow_dispatch:
    inputs:
      target:
        description: Production target
        required: true
        type: choice
        options: [web, console, portal, android-stable, android-alpha]
      run_id:
        description: Workflow run containing the website, console or Android artifact
        type: string
      artifact:
        description: Exact artifact name for web or Android
        type: string
      image:
        description: GHCR digest reference for portal
        type: string
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      run_id:
        type: string
      artifact:
        type: string
      image:
        type: string
    secrets:
      LUMATILE_DEPLOY_KEY:
        required: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'push' && github.ref_type == 'tag' &&
       (inputs.target == 'android-stable' || inputs.target == 'android-alpha'))
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      group: production-${{ inputs.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target }}
      ARTIFACT: ${{ inputs.artifact }}
      RUN_ID: ${{ inputs.run_id }}
      IMAGE: ${{ inputs.image }}
    steps:
      - name: Verify selected artifact source
        if: inputs.target != 'portal'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $RUN_ID =~ ^[0-9]+$ ]]
          read -r workflow branch conclusion event sha < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '[.path,.head_branch,(.conclusion // "-"),.event,.head_sha] | @tsv'
          )
          if [[ $RUN_ID != "$GITHUB_RUN_ID" && $conclusion != success ]]; then
            echo 'The selected workflow run did not succeed.' >&2
            exit 1
          fi
          workflow=${workflow%%@*}
          if [[ $TARGET == web ]]; then
            # Keep successful website artifacts from before the workflow split available for manual redeploys.
            [[ $workflow == .github/workflows/website.yml || ( $workflow == .github/workflows/server.yml && $GITHUB_EVENT_NAME == workflow_dispatch ) ]] || exit 1
            [[ $branch == main && $event != pull_request && $ARTIFACT == "lumatile-web-$sha" ]]
          elif [[ $TARGET == console ]]; then
            [[ $workflow == .github/workflows/console.yml && $branch == main && $event != pull_request && $ARTIFACT == "lumatile-console-$sha" ]]
          elif [[ $TARGET == android-stable || $TARGET == android-alpha ]]; then
            channel=${TARGET#android-}
            [[ $workflow == .github/workflows/release-android.yml && $event == push && $ARTIFACT == update-source-android-"$channel"-*-"$RUN_ID"-* ]]
          else
            exit 1
          fi
      - name: Check that the built source still matches main
        id: freshness
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree() {
            gh api "repos/$GITHUB_REPOSITORY/git/trees/$1?recursive=1" |
              jq -ce --arg target "$TARGET" 'select(.truncated == false) |
                [.tree[] | select(
                  if $target == "web" then .path == "frontend/website/public"
                  elif $target == "console" then .path == "frontend/console/public"
                  else .type == "blob" and (.path |
                    (startswith("backend/") or startswith("deploy/server/") or . == "scripts/publish_announcement.py") and
                    . != "backend/README.md" and . != "deploy/server/README.md" and
                    . != "deploy/server/deploy-web.sh" and . != "deploy/server/deploy-console.sh" and
                    . != "deploy/server/promote-android.sh")
                  end
                ) | {path, mode, sha}] | sort_by(.path)'
          }
          built=$(tree "$GITHUB_SHA")
          current=$(tree main)
          if [[ $built != "$current" ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Deployment skipped because main has newer source for this target.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@v4
        if: inputs.target != 'portal' && steps.freshness.outputs.skip != 'true'
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: payload
      - name: Deploy selected artifact
        if: steps.freshness.outputs.skip != 'true'
        env:
          SSH_TARGET: ${{ vars.LUMATILE_DEPLOY_TARGET }}
          SSH_KEY: ${{ secrets.LUMATILE_DEPLOY_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.LUMATILE_SSH_KNOWN_HOSTS }}
        run: |
          : "${SSH_KEY:?Set the LUMATILE_DEPLOY_KEY secret in the production environment}"
          : "${SSH_TARGET:?Set the LUMATILE_DEPLOY_TARGET variable in the production environment}"
          : "${SSH_KNOWN_HOSTS:?Set the LUMATILE_SSH_KNOWN_HOSTS variable in the production environment}"
          [[ $SSH_TARGET =~ ^[a-z_][a-z0-9_-]*@[a-zA-Z0-9.-]+$ ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          remote=(ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" "$SSH_TARGET")
          if [[ $TARGET == portal ]]; then
            [[ $IMAGE =~ ^ghcr\.io/c1oudreamw/qlu-toolbox/server@sha256:[a-f0-9]{64}$ ]]
            "${remote[@]}" "sudo -n /srv/apps/lumatile/deploy-portal.sh '$IMAGE'"
            curl -fsS --max-time 15 https://api.lumatile.cn/healthz
            curl -fsS --max-time 15 -o /dev/null https://console.lumatile.cn/admin/login/
          else
            if [[ $TARGET == web ]]; then
              revision=${ARTIFACT#lumatile-web-}
              [[ $revision =~ ^[a-f0-9]{40}$ ]]
              command="LUMATILE_WEB_CHECK_URL=https://lumatile.cn/download/ bash /srv/apps/lumatile/deploy-web.sh \"\$stage\" '$revision'"
            elif [[ $TARGET == console ]]; then
              revision=${ARTIFACT#lumatile-console-}
              [[ $revision =~ ^[a-f0-9]{40}$ ]]
              command="bash /srv/apps/lumatile/deploy-console.sh \"\$stage\" '$revision'"
            else
              channel=${TARGET#android-}
              [[ $channel == stable || $channel == alpha ]]
              command="bash /srv/apps/lumatile/promote-android.sh \"\$stage\" '$channel'"
            fi
            tar -C payload -czf - . | "${remote[@]}" "set -eu; stage=\$(mktemp -d); trap 'rm -rf -- \"\$stage\"' EXIT; tar -xzf - -C \"\$stage\"; $command"
          fi
