name: Release macOS

on:
  push:
    tags: ['mac-v*', 'mac-alpha-v*']

permissions:
  contents: read

env:
  LUMATILE_BUILD_CHANNEL: stable

concurrency:
  group: release-macos-${{ startsWith(github.ref_name, 'mac-alpha-v') && 'alpha' || 'stable' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify macOS arm64
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate immutable release identity and rollout gate
        id: version
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/validate-independent-release.mjs macos "$GITHUB_REF_NAME"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --locked
          uv lock --check
      - name: Prepare and verify macOS version
        run: |
          test "$(uname -m)" = arm64
          node scripts/prepare-release.mjs --platform macos
          node scripts/prepare-release.mjs --platform macos --verify
      - name: Test and build macOS application
        run: |
          uv run --locked python -B -m unittest discover -s tests -v
          npm run test:release
          npm run build:backend
          npm run build
          npm run test:desktop
          npx electron-builder --mac dmg --arm64 --publish never
      - name: Verify mounted DMG, signature, architecture and runtime versions
        run: |
          version=$(node -p "require('./lumatile/build-info.json').version")
          product_name=$(node -p "require('./lumatile/build-info.json').productName")
          prefix=LumaTile
          if [ "$LUMATILE_BUILD_CHANNEL" = alpha ]; then prefix=LumaTile-Alpha; fi
          mount_dir=$(mktemp -d)
          trap 'bash scripts/detach-dmg.sh "$mount_dir" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "release/${prefix}_v${version}_arm64.dmg" -nobrowse -mountpoint "$mount_dir"
          node scripts/verify-release-build.mjs macos "$GITHUB_REF_NAME" "$mount_dir/$product_name.app" verification.json
          bash scripts/detach-dmg.sh "$mount_dir"
          trap - EXIT
          mkdir artifacts
          cp "release/${prefix}_v${version}_arm64.dmg" "artifacts/${prefix}-macOS-v${version}-arm64.dmg"
      - name: Build macOS-only update source bundle
        run: node scripts/build-release-bundle.mjs macos "$GITHUB_REF_NAME" artifacts verification.json update-source
      - name: Upload verified deployment bundle before publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-source-macos-${{ steps.version.outputs.channel }}-${{ steps.version.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: update-source
          if-no-files-found: error

  publish:
    name: Publish the verified macos release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Recheck immutable source before publication
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/validate-independent-release.mjs macos "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: update-source-macos-${{ needs.build.outputs.channel }}-${{ needs.build.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: update-source
      - name: Publish complete assets through a verified draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-platform-release.mjs macos "$GITHUB_REF_NAME" "update-source/releases/$GITHUB_REF_NAME"
