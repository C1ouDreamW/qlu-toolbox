name: Server artifacts

on:
  pull_request:
    paths: ['deploy/server/**', 'apps/server/**', 'apps/website/**', '.dockerignore', '.github/workflows/server.yml', '.github/workflows/deploy-server.yml']
  push:
    branches: [main]
    paths: ['deploy/server/**', 'apps/server/**', 'apps/website/**', '.dockerignore', '.github/workflows/server.yml', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LUMATILE_SECRET_KEY: local-ci-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: node --test apps/website/tests/downloads.test.mjs
      - run: uv run --directory apps/server --locked python manage.py test portal
      - run: uv run --directory apps/server --locked python manage.py makemigrations --check --dry-run
      - run: uv run --directory apps/server --locked python -m unittest test_jobs
      - run: bash deploy/server/check-compose.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lumatile-web-${{ github.sha }}
          path: apps/website/frontend
          if-no-files-found: error

  image:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      reference: ${{ steps.image.outputs.reference }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and publish the backend image
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/server:${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f apps/server/Dockerfile -t "$image" .
          docker push "$image"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "$reference" >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-server.yml
    with:
      target: web
      run_id: ${{ format('{0}', github.run_id) }}
      artifact: lumatile-web-${{ github.sha }}
    secrets:
      LUMATILE_DEPLOY_KEY: ${{ secrets.LUMATILE_DEPLOY_KEY }}

  deploy-portal:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-server.yml
    with:
      target: portal
      image: ${{ needs.image.outputs.reference }}
    secrets:
      LUMATILE_DEPLOY_KEY: ${{ secrets.LUMATILE_DEPLOY_KEY }}
