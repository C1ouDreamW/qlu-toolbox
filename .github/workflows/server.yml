name: Server artifacts

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'deploy/server/**'
      - '!deploy/server/deploy-web.sh'
      - '!deploy/server/promote-android.sh'
      - '!backend/README.md'
      - '!deploy/server/README.md'
      - 'scripts/publish_announcement.py'
      - '.github/workflows/server.yml'
      - '.github/workflows/deploy-server.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/server/**'
      - '!deploy/server/deploy-web.sh'
      - '!deploy/server/promote-android.sh'
      - '!backend/README.md'
      - '!deploy/server/README.md'
      - 'scripts/publish_announcement.py'
      - '.github/workflows/server.yml'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LUMATILE_SECRET_KEY: local-ci-tests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv run --directory backend --locked python manage.py test portal
      - run: uv run --directory backend --locked python manage.py makemigrations --check --dry-run
      - run: uv run --directory backend --locked python -m unittest test_jobs
      - run: uv run --directory backend --locked python -B -m unittest discover -s tests -v
      - run: bash deploy/server/check-compose.sh

  image:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      reference: ${{ steps.image.outputs.reference }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and publish the backend image
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/server:${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image" backend
          docker push "$image"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "$reference" >> "$GITHUB_STEP_SUMMARY"

  deploy-portal:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-server.yml
    with:
      target: portal
      image: ${{ needs.image.outputs.reference }}
    secrets:
      LUMATILE_DEPLOY_KEY: ${{ secrets.LUMATILE_DEPLOY_KEY }}
