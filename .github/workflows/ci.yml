name: CI

on:
  pull_request:
  push:
    branches: [main]
    # 仅非运行时文档或独立动画工程变更时跳过主分支 CI。
    # PR 保留完整检查，避免路径过滤让必需检查一直 Pending。
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "lumatile-logo-animation/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  LUMATILE_BUILD_CHANNEL: debug
  # Windows runner 默认 stdout 编码为 cp1252，测试中的中文 print 会触发
  # UnicodeEncodeError；强制 UTF-8 保持三个平台行为一致
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-workflows:
    name: Workflow verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate GitHub Actions workflows
        run: actionlint -shellcheck= -pyflakes=

  verify-windows:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse Windows development helpers
        shell: powershell
        run: |
          foreach ($file in @('scripts/build-mobile.ps1', 'scripts/build-and-install-android.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Check Python lockfile
        run: uv lock --check

      - name: Prepare and verify Windows version
        shell: bash
        run: |
          node scripts/prepare-release.mjs --platform windows
          node scripts/prepare-release.mjs --platform windows --verify
          npm run test:release

      - name: Run Python tests
        run: uv run --locked python -B -m unittest discover -s tests -v

      - name: Build Vue and Electron
        run: npm run build

      - name: Test desktop integration
        run: npm run test:desktop

      - name: Build Python worker
        run: npm run build:backend

      - name: Package Windows application directory
        run: npx electron-builder --win dir --publish never

  verify-macos:
    name: macOS arm64 verification
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # The app uses identity "-" (ad-hoc); no private signing material is used.
      CSC_FOR_PULL_REQUEST: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Check Python lockfile
        run: uv lock --check

      - name: Prepare and verify macOS version
        run: |
          node scripts/prepare-release.mjs --platform macos
          node scripts/prepare-release.mjs --platform macos --verify
          npm run test:release

      - name: Run Python tests
        run: uv run --locked python -B -m unittest discover -s tests -v

      - name: Build Vue and Electron
        run: npm run build

      - name: Test desktop integration
        run: npm run test:desktop

      - name: Build Python worker
        run: npm run build:backend

      - name: Smoke-test Python worker
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          response=$(printf '%s\n' '{"id":"smoke","method":"bootstrap","params":{}}' | ./backend-dist/LumaTileWorker --bridge)
          expected=$(node -p "require('./package.json').version")
          node -e 'const message=JSON.parse(process.argv[1]); if(message.id!=="smoke" || message.result.version!==process.argv[2]) process.exit(1)' "$response" "$expected"

      - name: Package ad-hoc signed Apple Silicon DMG
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Verify and mount DMG
        shell: bash
        run: |
          worker=$(find release -path '*/LumaTile Debug.app/Contents/Resources/backend/LumaTileWorker' -type f -print -quit)
          dmg=$(find release -maxdepth 1 -name 'LumaTile-Debug_v*_arm64.dmg' -type f -print -quit)
          test -n "$worker"
          test -x "$worker"
          test -n "$dmg"
          mount_dir=$(mktemp -d)
          trap 'bash scripts/detach-dmg.sh "$mount_dir" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount_dir"
          test -d "$mount_dir/LumaTile Debug.app"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/LumaTile Debug.app"
          response=$(printf '%s\n' '{"id":"smoke","method":"bootstrap","params":{}}' | "$mount_dir/LumaTile Debug.app/Contents/Resources/backend/LumaTileWorker" --bridge)
          expected=$(node -p "require('./package.json').version")
          node -e 'const message=JSON.parse(process.argv[1]); if(message.id!=="smoke" || message.result?.version!==process.argv[2] || message.result.browserComponent.error) process.exit(1)' "$response" "$expected"
          bash scripts/detach-dmg.sh "$mount_dir"
          trap - EXIT

      - name: Upload macOS test artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaTile-macOS-arm64-${{ github.sha }}
          path: release/LumaTile-Debug_v*_arm64.dmg
          if-no-files-found: error
          retention-days: 7

  verify-android:
    name: Android verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          # 该 action 默认安装 "tools platform-tools"，但旧版 "tools" 包已被 Google
          # 从 SDK 仓库移除（sdkmanager 报 Failed to find package 'tools'）。
          # cmdline-tools 由 action 自身下载，platforms/build-tools 由下一步安装。
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare and verify Android version
        run: |
          node scripts/prepare-release.mjs --platform android
          node scripts/prepare-release.mjs --platform android --verify
          npm run test:release

      - name: Test mobile update and UI logic
        run: npm run test:mobile

      - name: Build and sync Android web assets
        run: |
          npm run mobile:build
          npm run mobile:sync

      - name: Run Android tests and build debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - name: Verify debug application ID
        shell: bash
        run: grep -F "io.github.c1oudreamw.lumatile.debug" apps/mobile/android/app/build/outputs/logs/manifest-merger-debug-report.txt
