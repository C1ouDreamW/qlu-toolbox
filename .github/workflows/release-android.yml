name: Release Android

on:
  push:
    tags: ['android-v*']

permissions:
  contents: read

concurrency:
  group: release-android-stable
  cancel-in-progress: false

jobs:
  signing-migration-required:
    name: Protected Android signing migration required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block production signing until the protected pipeline is ready
        run: |
          echo '::error::Android release signing is disabled during migration. Complete docs/release-security.md; PR builds must use Debug only.'
          exit 1
