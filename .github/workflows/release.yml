name: Build and Release

on:
  push:
    tags: ["v*.*.*", "v*.*.*-*"]

permissions:
  contents: read

env:
  LUMATILE_BUILD_CHANNEL: stable

jobs:
  validate-legacy-release:
    name: Validate legacy release rollout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-legacy-release.mjs "$GITHUB_REF_NAME"

  build-windows:
    name: Build Windows artifacts
    needs: [validate-legacy-release]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Prepare legacy windows release version
        shell: bash
        run: |
          expected=$(node -p "require('./config/release-versions.json').windows.stable.version")
          test "v$expected" = "$GITHUB_REF_NAME"
          node scripts/prepare-release.mjs --platform windows
          node scripts/prepare-release.mjs --platform windows --verify

      - name: Build application
        run: |
          npm run build:backend
          npm run build

      - name: Package Windows artifacts
        run: npx electron-builder --win dir nsis --publish never

      - name: Create shortcut
        shell: pwsh
        run: |
          $ws = New-Object -ComObject WScript.Shell
          $lnk = $ws.CreateShortcut("release\win-unpacked\LumaTile.lnk")
          $lnk.TargetPath = ".\LumaTile.exe"
          $lnk.Save()

      - name: Package portable zip
        shell: pwsh
        run: |
          Rename-Item release\win-unpacked LumaTile
          Compress-Archive -Path release\LumaTile -DestinationPath "release\LumaTile_${{ github.ref_name }}.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/LumaTile_v*.zip
            release/LumaTile_*_Setup.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64 artifact
    needs: [validate-legacy-release]
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Prepare legacy macos release version
        shell: bash
        run: |
          expected=$(node -p "require('./config/release-versions.json').macos.stable.version")
          test "v$expected" = "$GITHUB_REF_NAME"
          node scripts/prepare-release.mjs --platform macos
          node scripts/prepare-release.mjs --platform macos --verify

      - name: Build application
        run: |
          npm run build:backend
          npm run build

      - name: Smoke-test Python worker
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"
          response=$(printf '%s\n' '{"id":"smoke","method":"bootstrap","params":{}}' | ./backend-dist/LumaTileWorker --bridge)
          expected=$(node -p "require('./package.json').version")
          node -e 'const message=JSON.parse(process.argv[1]); if(message.id!=="smoke" || message.result.version!==process.argv[2]) process.exit(1)' "$response" "$expected"

      - name: Package ad-hoc signed Apple Silicon DMG
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Verify and mount DMG
        shell: bash
        run: |
          worker=$(find release -path '*/LumaTile.app/Contents/Resources/backend/LumaTileWorker' -type f -print -quit)
          dmg=$(find release -maxdepth 1 -name 'LumaTile_v*_arm64.dmg' -type f -print -quit)
          test -n "$worker"
          test -x "$worker"
          test -n "$dmg"
          mount_dir=$(mktemp -d)
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount_dir"
          test -d "$mount_dir/LumaTile.app"
          codesign --verify --deep --strict --verbose=2 "$mount_dir/LumaTile.app"
          response=$(printf '%s\n' '{"id":"smoke","method":"bootstrap","params":{}}' | "$mount_dir/LumaTile.app/Contents/Resources/backend/LumaTileWorker" --bridge)
          expected=$(node -p "require('./package.json').version")
          node -e 'const message=JSON.parse(process.argv[1]); if(message.id!=="smoke" || message.result?.version!==process.argv[2] || message.result.browserComponent.error) process.exit(1)' "$response" "$expected"
          hdiutil detach "$mount_dir"
          trap - EXIT

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/LumaTile_v*_arm64.dmg
          if-no-files-found: error

  # Fail closed until unsigned build / protected signing / publication are separated.
  # Blocking this dependency also prevents the legacy combined release from publishing.
  build-android:
    name: Android signing migration required
    needs: [validate-legacy-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block legacy production signing
        run: |
          echo '::error::Legacy Android signing is disabled. Complete docs/release-security.md before restoring a protected signing workflow.'
          exit 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-android]
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Prepare release notes from changelog
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/*
          body_path: release-notes.md
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Build self-hosted update source bundle
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          version_code=$(node -p "require('./config/release-versions.json').android.stable.versionCode")
          apk=$(find artifacts -maxdepth 1 -name 'LumaTile-Android-v*.apk' -type f -print -quit)
          release_dir="update-source/releases/${GITHUB_REF_NAME}"
          mkdir -p "$release_dir" update-source/stable
          cp artifacts/* "$release_dir/"
          base_url="https://lumatile.ishua.cloud/releases/${GITHUB_REF_NAME}"
          node scripts/generate-android-update-manifest.mjs "$apk" update-source/stable/android.json "$version_code" "$version" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" release-notes.md "$base_url"
          node scripts/generate-legacy-desktop-update-manifest.mjs artifacts update-source/stable/desktop.json "$version" "$base_url" release-notes.md

      - name: Upload self-hosted update source bundle
        uses: actions/upload-artifact@v4
        with:
          name: update-source-${{ github.ref_name }}
          path: update-source
          if-no-files-found: error

      - name: Publish Android update manifest branch
        shell: bash
        run: |
          apk=$(find artifacts -maxdepth 1 -name 'LumaTile-Android-v*.apk' -type f -print -quit)
          test -n "$apk"
          version="${GITHUB_REF_NAME#v}"
          version_code=$(node -p "require('./config/release-versions.json').android.stable.versionCode")
          test -n "$version_code"
          git fetch origin main
          git checkout -B main origin/main
          node scripts/generate-android-update-manifest.mjs "$apk" updates/android.json "$version_code" "$version" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" release-notes.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add updates/android.json
          if git diff --cached --quiet; then exit 0; fi
          branch="automation/android-update-${GITHUB_REF_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git commit -m "chore(android): 更新 $GITHUB_REF_NAME 的公开更新清单"
          git push --set-upstream origin "$branch"
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?quick_pull=1"
          {
            echo "## Android update manifest"
            echo
            echo "The signed APK was published successfully."
            echo
            echo "[Create the update manifest pull request](${compare_url})"
            echo
            echo "Merge it after all required status checks pass to make the update visible to installed apps."
          } >> "$GITHUB_STEP_SUMMARY"
