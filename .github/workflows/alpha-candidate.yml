name: Build Alpha candidate (no release)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target (Android uses the long-term Alpha key)'
        required: true
        type: choice
        options: [windows, macos, android]
      commit:
        description: 'Full 40-character commit currently on main'
        required: true
        type: string

permissions:
  contents: read

env:
  LUMATILE_BUILD_CHANNEL: alpha
  RELEASE_EXPECTED_COMMIT: ${{ inputs.commit }}

concurrency:
  group: alpha-candidate-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build windows Alpha candidate
    if: ${{ github.repository == 'C1ouDreamW/qlu-toolbox' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify exact main dispatch before build
        id: identity
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/prepare-alpha-candidate.mjs identity windows
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.12'
      - name: Test and build Alpha desktop without publishing
        shell: bash
        run: |
          npm ci
          uv sync --locked
          uv lock --check
          npm run test:release
          uv run --locked python -B -m unittest discover -s tests -v
          node scripts/prepare-release.mjs --platform windows
          node scripts/prepare-release.mjs --platform windows --verify
          npm run build:backend
          npm run build
          npm run test:desktop
          npx electron-builder --win dir nsis --x64 --publish never
          node scripts/generate-build-inventory.mjs windows build-metadata
      - name: Verify and collect Alpha installer and portable ZIP
        shell: pwsh
        env:
          CANDIDATE_INSTALLER: ${{ steps.identity.outputs.filename }}
          CANDIDATE_PORTABLE: ${{ steps.identity.outputs.portable }}
        run: |
          node scripts/verify-release-build.mjs --candidate windows release/win-unpacked verification.json
          $version = node -p "require('./package.json').version"
          New-Item -ItemType Directory artifacts | Out-Null
          Copy-Item build-metadata/* artifacts
          Copy-Item "release/LumaTile-Alpha_v${version}_x64_Setup.exe" "artifacts/$env:CANDIDATE_INSTALLER"
          "@echo off`r`nstart `"`" `"%~dp0LumaTile Alpha.exe`"`r`n" | Set-Content -Encoding ascii 'release/win-unpacked/Start LumaTile Alpha.cmd'
          Rename-Item release/win-unpacked LumaTile-Alpha
          Compress-Archive -Path release/LumaTile-Alpha -DestinationPath "artifacts/$env:CANDIDATE_PORTABLE"
      - name: Record non-deployable candidate identity and hashes
        run: node scripts/prepare-alpha-candidate.mjs record windows verification.json artifacts candidate-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha-candidate-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-output
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Build macos Alpha candidate
    if: ${{ github.repository == 'C1ouDreamW/qlu-toolbox' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.platform == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify exact main dispatch before build
        id: identity
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/prepare-alpha-candidate.mjs identity macos
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: '3.12'
      - name: Test and build Alpha desktop without publishing
        shell: bash
        run: |
          npm ci
          uv sync --locked
          uv lock --check
          npm run test:release
          uv run --locked python -B -m unittest discover -s tests -v
          node scripts/prepare-release.mjs --platform macos
          node scripts/prepare-release.mjs --platform macos --verify
          npm run build:backend
          npm run build
          npm run test:desktop
          npx electron-builder --mac dmg --arm64 --publish never
          node scripts/generate-build-inventory.mjs macos build-metadata
      - name: Verify and collect the mounted Alpha DMG
        env:
          CANDIDATE_FILE: ${{ steps.identity.outputs.filename }}
        run: |
          version=$(node -p "require('./package.json').version")
          mount_dir=$(mktemp -d)
          trap 'bash scripts/detach-dmg.sh "$mount_dir" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "release/LumaTile-Alpha_v${version}_arm64.dmg" -nobrowse -mountpoint "$mount_dir"
          node scripts/verify-release-build.mjs --candidate macos "$mount_dir/LumaTile Alpha.app" verification.json
          bash scripts/detach-dmg.sh "$mount_dir"
          trap - EXIT
          mkdir artifacts
          cp build-metadata/* artifacts/
          cp "release/LumaTile-Alpha_v${version}_arm64.dmg" "artifacts/$CANDIDATE_FILE"
      - name: Record non-deployable candidate identity and hashes
        run: node scripts/prepare-alpha-candidate.mjs record macos verification.json artifacts candidate-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha-candidate-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-output
          if-no-files-found: error
          retention-days: 7

  android-build:
    name: Build unsigned Alpha candidate without secrets
    if: ${{ github.repository == 'C1ouDreamW/qlu-toolbox' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      commit: ${{ steps.receipt.outputs.commit }}
      unsigned_sha256: ${{ steps.receipt.outputs.unsigned_sha256 }}
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify exact main dispatch before build
        id: identity
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/prepare-alpha-candidate.mjs identity android
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Test and build an unsigned Alpha Release APK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          npm ci
          npm run test:release
          npm run test:mobile
          npm run mobile:build
          npm run mobile:sync
          bash apps/mobile/android/gradlew -p apps/mobile/android --no-daemon lintDebug testDebugUnitTest assembleRelease -PunsignedRelease=true
          bash apps/mobile/android/gradlew -p apps/mobile/android --no-daemon --init-script "$PWD/scripts/android-sbom.init.gradle" :app:cyclonedxDirectBom
          node scripts/generate-build-inventory.mjs android build-metadata apps/mobile/android/app/build/reports/sbom/android.cdx.json
          mkdir unsigned
          cp -R build-metadata unsigned/inventory
          cp apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk unsigned/app-release-unsigned.apk
      - name: Bind the unsigned APK to this main dispatch
        id: receipt
        run: node scripts/prepare-alpha-candidate.mjs record-unsigned android unsigned/app-release-unsigned.apk unsigned/unsigned-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha-candidate-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned
          if-no-files-found: error
          retention-days: 1

  android-sign:
    name: Sign Alpha candidate with its own key (no release)
    if: ${{ github.repository == 'C1ouDreamW/qlu-toolbox' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.platform == 'android' }}
    needs: [android-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_UNSIGNED_SHA256: ${{ needs.android-build.outputs.unsigned_sha256 }}
      RELEASE_RECEIPT_SHA256: ${{ needs.android-build.outputs.receipt_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.android-build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Recheck immutable main source before signing credentials
        run: |
          test "$RELEASE_EXPECTED_COMMIT" = "$BUILD_COMMIT"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/prepare-alpha-candidate.mjs identity android
        env:
          BUILD_COMMIT: ${{ needs.android-build.outputs.commit }}
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - name: Install only signing tools
        run: sdkmanager 'build-tools;36.0.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: alpha-candidate-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: unsigned
      - name: Verify the unsigned receipt without secrets
        run: node scripts/prepare-alpha-candidate.mjs verify-unsigned android unsigned/app-release-unsigned.apk unsigned/unsigned-receipt.json
      - name: Sign only the verified Alpha candidate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_ALPHA_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_ALPHA_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_ALPHA_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_ALPHA_KEY_PASSWORD }}
        run: node scripts/prepare-alpha-candidate.mjs sign android unsigned/app-release-unsigned.apk unsigned/unsigned-receipt.json artifacts verification.json
      - name: Record non-deployable candidate and final signed hashes
        run: node scripts/prepare-alpha-candidate.mjs record android verification.json artifacts candidate-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alpha-candidate-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-output
          if-no-files-found: error
          retention-days: 7
