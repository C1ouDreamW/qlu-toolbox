name: Console artifacts

on:
  pull_request:
    paths:
      - 'frontend/console/**'
      - '!frontend/console/README.md'
      - 'backend/openapi.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/server/deploy-console.sh'
      - 'deploy/server/deploy-web.sh'
      - 'deploy/server/nginx/sites.conf.example'
      - '.github/workflows/console.yml'
      - '.github/workflows/deploy-server.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/console/**'
      - '!frontend/console/README.md'
      - 'backend/openapi.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/server/deploy-console.sh'
      - 'deploy/server/deploy-web.sh'
      - 'deploy/server/nginx/sites.conf.example'
      - '.github/workflows/console.yml'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Console verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --workspace @lumatile/console
      - run: npm run build --workspace @lumatile/console
      - run: npm test --workspace @lumatile/console
      - run: npm exec --workspace @lumatile/console -- playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e --workspace @lumatile/console
      - run: |
          test -s frontend/console/dist/app.mjs
          bash -n deploy/server/deploy-console.sh
          bash -n deploy/server/deploy-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lumatile-console-${{ github.sha }}
          path: frontend/console/dist
          if-no-files-found: error

  deploy-console:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-server.yml
    with:
      target: console
      run_id: ${{ format('{0}', github.run_id) }}
      artifact: lumatile-console-${{ github.sha }}
    secrets:
      LUMATILE_DEPLOY_KEY: ${{ secrets.LUMATILE_DEPLOY_KEY }}
