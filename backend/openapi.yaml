openapi: 3.1.0
info:
  title: LumaTile API
  version: 1.0.0
servers:
  - url: https://api.lumatile.cn
paths:
  /v1/auth/session:
    get:
      operationId: getConsoleSession
      description: 返回当前维护者会话并签发 CSRF 令牌。
      responses:
        '200': { $ref: '#/components/responses/ConsoleSession' }
    post:
      operationId: createConsoleSession
      security: [{ csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username: { type: string, minLength: 1, maxLength: 150 }
                password: { type: string, format: password, minLength: 1, maxLength: 1024 }
      responses:
        '200': { $ref: '#/components/responses/ConsoleSession' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteConsoleSession
      security: [{ csrf: [] }]
      responses:
        '200': { $ref: '#/components/responses/ConsoleSession' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/auth/password:
    post:
      operationId: changeConsolePassword
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password1, new_password2]
              additionalProperties: false
              properties:
                old_password: { type: string, format: password }
                new_password1: { type: string, format: password }
                new_password2: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/ConsoleSession' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/overview:
    get:
      operationId: getConsoleOverview
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: Windows、macOS 和 Android 各渠道的线上版本
          content:
            application/json:
              schema:
                type: object
                required: [windows, macos, android]
                properties:
                  windows: { type: [string, 'null'] }
                  macos: { type: [string, 'null'] }
                  android:
                    type: object
                    required: [stable, alpha]
                    properties:
                      stable: { type: [string, 'null'] }
                      alpha: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/announcement-drafts:
    get:
      operationId: listAnnouncementDrafts
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: 公告草稿列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AnnouncementDraft' } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createAnnouncementDraft
      security: [{ staffSession: [], csrf: [] }]
      requestBody: { $ref: '#/components/requestBodies/AnnouncementDraft' }
      responses:
        '201': { $ref: '#/components/responses/AnnouncementDraft' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/announcement-drafts/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer } }
    get:
      operationId: getAnnouncementDraft
      security: [{ staffSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnnouncementDraft' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: updateAnnouncementDraft
      security: [{ staffSession: [], csrf: [] }]
      requestBody: { $ref: '#/components/requestBodies/AnnouncementDraft' }
      responses:
        '200': { $ref: '#/components/responses/AnnouncementDraft' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteAnnouncementDraft
      security: [{ staffSession: [], csrf: [] }]
      responses:
        '204': { description: 公告草稿已删除 }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/statistics:
    get:
      operationId: getStatistics
      security: [{ staffSession: [] }]
      responses:
        '200':
          description: 最近生成的匿名统计报表 JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatisticsReport' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/operations:
    get:
      operationId: listOperations
      security: [{ staffSession: [] }]
      parameters:
        - { in: query, name: offset, schema: { type: integer, minimum: 0 } }
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
      responses:
        '200':
          description: 最近的分发策略和发布操作及下一页偏移量
          content:
            application/json:
              schema:
                type: object
                required: [items, nextOffset]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [actor, resource, value, created_at]
                      properties:
                        actor: { type: string }
                        resource: { type: string }
                        value: { type: string }
                        created_at: { type: string, format: date-time }
                  nextOffset: { type: [integer, 'null'], minimum: 0 }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/feedback-submissions:
    post:
      operationId: createFeedbackSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, content, platform, appVersion]
              properties:
                type: { enum: [bug, suggestion] }
                content: { type: string, minLength: 2, maxLength: 2000 }
                contact: { type: string, maxLength: 120 }
                platform: { enum: [desktop, android] }
                appVersion: { type: string, minLength: 1, maxLength: 40 }
                systemVersion: { type: string, maxLength: 120 }
      responses:
        '201':
          description: 反馈已创建
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, pattern: '^FB-[0-9A-F]{8}$' }
        '400': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      operationId: listFeedbackSubmissions
      security: [{ staffSession: [] }]
      parameters:
        - { in: query, name: status, schema: { enum: [all, new, resolved] } }
        - { in: query, name: type, schema: { enum: [bug, suggestion] } }
        - { in: query, name: platform, schema: { enum: [desktop, android] } }
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: 反馈、分页链接和状态计数
          content:
            application/json:
              schema:
                type: object
                required: [total, items, counts, links]
                properties:
                  total: { type: integer, minimum: 0 }
                  items: { type: array, items: { $ref: '#/components/schemas/Feedback' } }
                  counts:
                    type: object
                    required: [new, resolved]
                    properties:
                      new: { type: integer, minimum: 0 }
                      resolved: { type: integer, minimum: 0 }
                  links:
                    type: object
                    required: [self, next, previous]
                    properties:
                      self: { type: string }
                      next: { type: [string, 'null'] }
                      previous: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/feedback-submissions/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getFeedbackSubmission
      security: [{ staffSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Feedback' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateFeedbackSubmission
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { enum: [new, resolved] }
      responses:
        '200': { $ref: '#/components/responses/Feedback' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/distribution-policies/android:
    get:
      operationId: getAndroidDistributionPolicy
      security: [{ staffSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Policy' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      operationId: replaceAndroidDistributionPolicy
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: { enum: [server, website] }
      responses:
        '200': { $ref: '#/components/responses/Policy' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/channels/{channel}/active-announcement:
    parameters:
      - { in: path, name: channel, required: true, schema: { enum: [stable, alpha] } }
    get:
      operationId: getActiveAnnouncement
      security: [{ staffSession: [] }]
      responses:
        '200': { $ref: '#/components/responses/Announcement' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      operationId: replaceActiveAnnouncement
      security: [{ staffSession: [], csrf: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draftId]
              properties:
                draftId: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/Announcement' }
        '201': { $ref: '#/components/responses/Announcement' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteActiveAnnouncement
      security: [{ staffSession: [], csrf: [] }]
      responses:
        '204': { description: 已撤回 }
        '403': { $ref: '#/components/responses/Problem' }
components:
  requestBodies:
    AnnouncementDraft:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, body, level, url, expiresAt]
            additionalProperties: false
            properties:
              title: { type: string, minLength: 1, maxLength: 120 }
              body: { type: string, minLength: 1 }
              level: { enum: [info, warning] }
              url: { type: string, description: HTTPS 地址或空字符串 }
              expiresAt: { type: [string, 'null'], format: date-time }
  schemas:
    AnnouncementDraft:
      type: object
      required: [id, title, body, level, url, expiresAt]
      properties:
        id: { type: integer, minimum: 1 }
        title: { type: string }
        body: { type: string }
        level: { enum: [info, warning] }
        url: { type: string, description: HTTPS 地址或空字符串 }
        expiresAt: { type: [string, 'null'], format: date-time }
    CountByLabel:
      type: array
      items:
        type: object
        required: [label, count]
        properties:
          label: { type: string }
          count: { type: integer, minimum: 0 }
    StatisticsReport:
      type: object
      required: [generated_at, range_days, days, dau, raw_checks, downloads, new_installs,
                 version_dist, os_dist, client_dist, arch_dist, top_files, totals,
                 github_snapshot_day, github_by_asset]
      properties:
        generated_at: { type: string, description: 服务器本地时间 }
        range_days: { type: integer, minimum: 1 }
        days: { type: array, items: { type: string, format: date } }
        dau: { type: array, items: { type: integer, minimum: 0 } }
        raw_checks: { type: array, items: { type: integer, minimum: 0 } }
        downloads: { type: array, items: { type: integer, minimum: 0 } }
        new_installs: { type: array, items: { type: integer, minimum: 0 } }
        version_dist: { $ref: '#/components/schemas/CountByLabel' }
        os_dist: { $ref: '#/components/schemas/CountByLabel' }
        client_dist: { $ref: '#/components/schemas/CountByLabel' }
        arch_dist: { $ref: '#/components/schemas/CountByLabel' }
        top_files: { $ref: '#/components/schemas/CountByLabel' }
        totals:
          type: object
          required: [installs, downloads_selfhosted, beacons, manifest_checks, update_checks, downloads_github]
          properties:
            installs: { type: integer, minimum: 0 }
            downloads_selfhosted: { type: integer, minimum: 0 }
            beacons: { type: integer, minimum: 0 }
            manifest_checks: { type: integer, minimum: 0 }
            update_checks: { type: integer, minimum: 0 }
            downloads_github: { type: integer, minimum: 0 }
        github_snapshot_day: { type: [string, 'null'], format: date }
        github_by_asset: { $ref: '#/components/schemas/CountByLabel' }
    Feedback:
      type: object
      required: [id, type, content, platform, app_version, status, created_at]
      properties:
        id: { type: string }
        type: { enum: [bug, suggestion] }
        content: { type: string }
        contact: { type: string }
        platform: { enum: [desktop, android] }
        app_version: { type: string }
        system_version: { type: string }
        status: { enum: [new, resolved] }
        created_at: { type: string, format: date-time }
  securitySchemes:
    staffSession: { type: apiKey, in: cookie, name: sessionid }
    csrf: { type: apiKey, in: header, name: X-CSRFToken }
  responses:
    AnnouncementDraft:
      description: 公告草稿
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AnnouncementDraft' }
    ConsoleSession:
      description: 当前维护者、页面权限和用于后续写操作的 CSRF 令牌
      content:
        application/json:
          schema:
            type: object
            required: [user, permissions, csrfToken]
            properties:
              user: { type: [string, 'null'] }
              permissions:
                type: object
                required: [addDraft, editDraft, deleteDraft, viewOperations]
                properties:
                  addDraft: { type: boolean }
                  editDraft: { type: boolean }
                  deleteDraft: { type: boolean }
                  viewOperations: { type: boolean }
              csrfToken: { type: string }
    Feedback:
      description: 反馈资源
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Feedback' }
    Announcement:
      description: 当前渠道的公告
      content:
        application/json:
          schema:
            type: object
            required: [schemaVersion, id, title, body, level]
            properties:
              schemaVersion: { const: 1 }
              id: { type: string }
              title: { type: string }
              body: { type: string }
              level: { enum: [info, warning] }
              url: { type: string, format: uri }
              expiresAt: { type: string, format: date-time }
    Policy:
      description: 已生效的 Android 分发策略
      content:
        application/json:
          schema:
            type: object
            required: [mode, websiteUrl]
            properties:
              mode: { enum: [server, website] }
              websiteUrl: { type: string, format: uri }
    Problem:
      description: 请求失败
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code, detail]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              code: { type: string }
              detail: { type: string }
