{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}{% endblock %} · LumaTile 控制台</title>
  <link rel="icon" href="{% static 'portal/logo.png' %}" type="image/png">
  <link rel="stylesheet" href="{% static 'portal/console.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="console login">
<main class="login-shell">
  <aside class="login-brand">
    <img class="brand-icon" src="{% static 'portal/logo.png' %}" width="64" height="64" alt="">
    <p class="login-brand-name">一格有光</p>
    <p class="login-brand-product" lang="en">LumaTile</p>
    <a href="https://lumatile.cn/">访问官网 <span aria-hidden="true">↗</span></a>
  </aside>
  <section class="login-panel" aria-labelledby="login-title">
    {% block content %}{% endblock %}
  </section>
</main>
</body>
</html>
