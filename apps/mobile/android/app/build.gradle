import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file('keystore.properties')
if (releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def releaseStorePath = System.getenv('ANDROID_KEYSTORE_FILE') ?: releaseSigning.getProperty('storeFile')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: releaseSigning.getProperty('storePassword')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: releaseSigning.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: releaseSigning.getProperty('keyPassword')
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }
// 临时测试包开关：传 -PappIdSuffix=.test 时只影响 debug 构建，产出可与正式版共存的测试包。
// 不传参数时行为与正式包完全一致（CI 与本地常规构建均不传）。
def testAppIdSuffix = (project.findProperty('appIdSuffix') ?: '').toString().trim()
if (testAppIdSuffix && !testAppIdSuffix.startsWith('.')) {
    testAppIdSuffix = '.' + testAppIdSuffix
}
def testAppLabel = (project.findProperty('appLabel') ?: '一格有光（测试）').toString().trim()
def webViewCompatibilityFile = rootProject.file('../webview-compatibility.json')
def webViewCompatibility = new JsonSlurper().parse(webViewCompatibilityFile)
def releaseVersions = new JsonSlurper().parse(rootProject.file('../../../config/release-versions.json'))
def androidVersion = releaseVersions.android
if (releaseVersions.schemaVersion != 1 || !(androidVersion?.version instanceof String) ||
        !(androidVersion.version ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/) ||
        !(androidVersion.versionCode instanceof Integer) || androidVersion.versionCode <= 0 || androidVersion.versionCode > 2100000000) {
    throw new GradleException('Invalid Android release version configuration')
}
def verifyWebVersion = tasks.register('verifyWebVersion') {
    def metadataFile = file('src/main/assets/public/lumatile-version.json')
    inputs.file rootProject.file('../../../config/release-versions.json')
    // Check on every build, including after cap sync replaces generated assets.
    doLast {
        if (!metadataFile.exists()) {
            throw new GradleException('Missing Android Web version metadata; run npm run mobile:build && npm run mobile:sync')
        }
        def metadata = new JsonSlurper().parse(metadataFile)
        if (metadata.platform != 'android' || metadata.version != androidVersion.version || metadata.versionCode != androidVersion.versionCode) {
            throw new GradleException('Android Web/native version mismatch; run npm run mobile:build && npm run mobile:sync')
        }
    }
}
def generatedWebViewAssetsDir = file("$buildDir/generated/webviewAssets")
def buildWebViewAssets = tasks.register('buildWebViewAssets', Exec) {
    workingDir rootProject.file('../../..')
    commandLine 'node', 'apps/mobile/scripts/build-webview-assets.mjs', generatedWebViewAssetsDir.absolutePath
    inputs.file webViewCompatibilityFile
    inputs.file rootProject.file('../../../assets/qlu-schedule-dom.js')
    inputs.dir rootProject.file('../webview-scripts')
    inputs.file rootProject.file('../scripts/build-webview-assets.mjs')
    outputs.dir generatedWebViewAssetsDir
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

android {
    namespace = "io.github.c1oudreamw.lumatile"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "io.github.c1oudreamw.lumatile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidVersion.versionCode
        versionName androidVersion.version
        buildConfigField "int", "MIN_WEBVIEW_MAJOR", webViewCompatibility.minimumMajor.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        main.assets.srcDirs += generatedWebViewAssetsDir
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            if (testAppIdSuffix) {
                applicationIdSuffix testAppIdSuffix
                versionNameSuffix '-test'
                resValue "string", "app_name", testAppLabel
                resValue "string", "title_activity_main", testAppLabel
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

tasks.named('preBuild').configure { dependsOn buildWebViewAssets, verifyWebVersion }

tasks.matching { it.name == 'packageRelease' || it.name == 'assembleRelease' }.configureEach {
    doFirst {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing is required. Configure keystore.properties or ANDROID_KEYSTORE_* environment variables.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.room:room-runtime:2.7.2"
    implementation "androidx.room:room-ktx:2.7.2"
    implementation "org.apache.poi:poi:5.5.1"
    kapt "androidx.room:room-compiler:2.7.2"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
