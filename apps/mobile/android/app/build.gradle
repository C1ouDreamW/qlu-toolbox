import groovy.json.JsonSlurper

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def buildInformationFile = rootProject.file('../build-info.json')
if (!buildInformationFile.exists()) {
    throw new GradleException('Missing build information; run npm run mobile:build && npm run mobile:sync')
}
def androidBuild = new JsonSlurper().parse(buildInformationFile)
def buildChannel = androidBuild.channel
def expectedApplicationId = "io.github.c1oudreamw.lumatile" + (buildChannel == 'stable' ? '' : ".${buildChannel}")
if (androidBuild.schemaVersion != 1 || androidBuild.platform != 'android' ||
        !(buildChannel in ['debug', 'alpha', 'stable']) || androidBuild.applicationId != expectedApplicationId ||
        !(androidBuild.baseVersion ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/) ||
        !(androidBuild.versionCode instanceof Integer) || androidBuild.versionCode < 1 || androidBuild.versionCode > 2100000000) {
    throw new GradleException('Invalid Android build information')
}
if (project.hasProperty('appIdSuffix') || project.hasProperty('appLabel')) {
    throw new GradleException('Legacy test-package overrides are retired. Debug always uses .debug; run npm run mobile:build first.')
}
def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file(buildChannel == 'alpha' ? 'alpha-keystore.properties' : 'keystore.properties')
if (buildChannel != 'debug' && releaseSigningFile.exists()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def signingPrefix = buildChannel == 'alpha' ? 'ANDROID_ALPHA_' : 'ANDROID_'
def releaseStorePath = buildChannel == 'debug' ? null : System.getenv(signingPrefix + 'KEYSTORE_FILE') ?: releaseSigning.getProperty('storeFile')
def releaseStorePassword = buildChannel == 'debug' ? null : System.getenv(signingPrefix + 'KEYSTORE_PASSWORD') ?: releaseSigning.getProperty('storePassword')
def releaseKeyAlias = buildChannel == 'debug' ? null : System.getenv(signingPrefix + 'KEY_ALIAS') ?: releaseSigning.getProperty('keyAlias')
def releaseKeyPassword = buildChannel == 'debug' ? null : System.getenv(signingPrefix + 'KEY_PASSWORD') ?: releaseSigning.getProperty('keyPassword')
def hasReleaseSigning = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.isBlank() }
def unsignedRelease = project.findProperty('unsignedRelease') == 'true'
if (unsignedRelease && ([releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].any { it != null && !it.isBlank() } || System.getenv(signingPrefix + 'KEYSTORE_BASE64'))) {
    throw new GradleException('Unsigned release builds must not receive signing credentials')
}
def webViewCompatibilityFile = rootProject.file('../webview-compatibility.json')
def webViewCompatibility = new JsonSlurper().parse(webViewCompatibilityFile)
def verifyWebVersion = tasks.register('verifyWebVersion') {
    def metadataFile = file('src/main/assets/public/lumatile-version.json')
    inputs.file buildInformationFile
    // Check on every build, including after cap sync replaces generated assets.
    doLast {
        if (!metadataFile.exists()) {
            throw new GradleException('Missing Android Web version metadata; run npm run mobile:build && npm run mobile:sync')
        }
        def metadata = new JsonSlurper().parse(metadataFile)
        if (metadata.platform != 'android' || metadata.channel != buildChannel || metadata.applicationId != androidBuild.applicationId || metadata.version != androidBuild.version || metadata.versionCode != androidBuild.versionCode || metadata.commit != androidBuild.commit) {
            throw new GradleException('Android Web/native version mismatch; run npm run mobile:build && npm run mobile:sync')
        }
    }
}
def generatedWebViewAssetsDir = file("$buildDir/generated/webviewAssets")
def buildWebViewAssets = tasks.register('buildWebViewAssets', Exec) {
    workingDir rootProject.file('../../..')
    commandLine 'node', 'apps/mobile/scripts/build-webview-assets.mjs', generatedWebViewAssetsDir.absolutePath
    inputs.file webViewCompatibilityFile
    inputs.file rootProject.file('../../../assets/qlu-schedule-dom.js')
    inputs.dir rootProject.file('../webview-scripts')
    inputs.file rootProject.file('../scripts/build-webview-assets.mjs')
    outputs.dir generatedWebViewAssetsDir
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

android {
    namespace = "io.github.c1oudreamw.lumatile"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "io.github.c1oudreamw.lumatile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode androidBuild.versionCode
        versionName androidBuild.baseVersion
        buildConfigField "String", "RELEASE_CHANNEL", '"' + buildChannel + '"'
        resValue "string", "app_name", androidBuild.productName
        resValue "string", "title_activity_main", androidBuild.productName
        buildConfigField "int", "MIN_WEBVIEW_MAJOR", webViewCompatibility.minimumMajor.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    sourceSets {
        main.assets.srcDirs += generatedWebViewAssetsDir
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }
    signingConfigs {
        debug {
            def debugStore = System.getenv('LUMATILE_DEBUG_KEYSTORE_FILE')
            if (debugStore) storeFile file(debugStore)
        }
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug.0'
            buildConfigField "String", "RELEASE_CHANNEL", '"debug"'
            resValue "string", "app_name", 'LumaTile Debug'
            resValue "string", "title_activity_main", 'LumaTile Debug'
        }
        release {
            debuggable false
            if (buildChannel == 'alpha') {
                applicationIdSuffix '.alpha'
                versionNameSuffix androidBuild.version.substring(androidBuild.baseVersion.length())
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

tasks.named('preBuild').configure { dependsOn buildWebViewAssets, verifyWebVersion }

tasks.matching { it.name == 'packageRelease' || it.name == 'assembleRelease' }.configureEach {
    doFirst {
        if (buildChannel == 'debug') {
            throw new GradleException('Debug build information cannot produce a Release APK; explicitly prepare --channel stable or alpha')
        }
        if (!hasReleaseSigning && !unsignedRelease) {
            throw new GradleException('Release signing is required. Configure keystore.properties or ANDROID_KEYSTORE_* environment variables.')
        }
    }
}

tasks.matching { it.name == 'packageDebug' || it.name == 'assembleDebug' }.configureEach {
    doFirst {
        if (buildChannel != 'debug') {
            throw new GradleException('Debug APK requires Debug Web assets; run npm run mobile:build && npm run mobile:sync with the Debug channel')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "androidx.room:room-runtime:2.7.2"
    implementation "androidx.room:room-ktx:2.7.2"
    implementation "org.apache.poi:poi:5.5.1"
    kapt "androidx.room:room-compiler:2.7.2"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
